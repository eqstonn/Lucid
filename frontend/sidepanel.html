<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lucid</title>
  <!-- Tailwind Play CDN build, vendored locally: MV3 CSP forbids remote scripts on extension pages. -->
  <script src="vendor/tailwind.js"></script>
  <style>
    html, body { height: 100%; }
    body { min-width: 0; overflow-x: hidden; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-200 text-sm antialiased">
  <div id="app" class="flex h-full w-full flex-col">
    <header id="header" class="flex items-center gap-2 border-b border-neutral-800 px-3 py-2"></header>
    <div id="banner" class="hidden border-b border-neutral-800 px-3 py-1.5 text-xs"></div>
    <main id="view" class="min-h-0 flex-1 overflow-y-auto overflow-x-hidden p-3"></main>
    <nav class="flex border-t border-neutral-800 bg-neutral-900">
      <button id="nav-home" class="flex-1 py-2.5 text-xs font-medium hover:bg-neutral-800">Home</button>
      <button id="nav-sync" class="flex-1 border-l border-neutral-800 py-2.5 text-xs font-medium hover:bg-neutral-800">[ Sync ]</button>
    </nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/grades.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
